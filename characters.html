<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personagens — AI Filipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>
  <header class="site-header">
    <div class="brand-wrap">
      <a class="brand" href="/">
        <div class="brand-badge">AI</div>
        <div class="brand-text"><h1>AI Filipe</h1><p class="tag">Personagens</p></div>
      </a>
      <nav class="main-nav">
        <a href="/">Chat</a>
        <a href="/characters.html">Personagens</a>
        <a href="/index.html#origem">Origem / Fonte</a>
      </nav>
    </div>
  </header>

  <main class="app" style="grid-template-columns:1fr;">
    <section style="padding:16px;">
      <h2>Personagens</h2>
      <div class="chars" id="chars"></div>
      <div style="max-width:1100px;margin:16px auto;color:var(--muted);padding:0 12px">Voltar ao <a href="/">chat</a>.</div>
    </section>
  </main>

  <footer>
    <p>Feito por Filipe — AI Filipe ©</p>
  </footer>

  <script>
    async function load(){
      try{
        const res = await fetch('/data/characters.json');
        const data = await res.json();
        const root = document.getElementById('chars');
        data.forEach(c=>{
          const el = document.createElement('article');
          el.className='card';
          el.innerHTML = `<h3>${c.name}</h3><p>${c.description}</p><a href="${c.wiki}" target="_blank" rel="noopener">Fonte / Wiki</a>`;
          const tags = document.createElement('div');tags.className='tags';
          c.notable_traits.forEach(t=>{const s=document.createElement('div');s.className='tag';s.textContent=t;tags.appendChild(s)});
          el.appendChild(tags);
          root.appendChild(el);
        })
      }catch(e){console.error(e)}
    }
    load();
  </script>
</body>
</html>
