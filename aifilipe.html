<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registos de Acesso — AI Filipe</title>
  
  <!-- SDK Oficial do Supabase via CDN -->
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #061021;
      color: #e6f7ff;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h2 { color: #76e4ff; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    
    /* Estilo da Tabela */
    .tabela-container {
      background: rgba(15,24,35,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    th {
      background-color: rgba(255,255,255,0.03);
      color: #ffe082;
      font-weight: 600;
    }
    tr:hover { background-color: rgba(255,255,255,0.02); }
    .status-badge {
      background: rgba(122,233,179,0.15);
      color: #7ae9b3;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📋 Histórico de Acessos à Página</h2>
  <p>Cada vez que esta página é aberta, um novo registo é enviado e listado abaixo em tempo real.</p>
  
  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Data / Hora (Lisboa)</th>
          <th>Navegador (User-Agent)</th>
          <th>Idioma</th>
          <th>Plataforma</th>
          <th>Ecrã</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo">
        <tr>
          <td colspan="5" style="text-align: center; color: #9fb7c9;">A carregar registos...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 1. Configuração do Supabase
  // PREENCHA COM OS SEUS DADOS REAIS DO SUPABASE
  const SUPABASE_URL = 'https://SUA_URL_AQUI.supabase.co';
  const SUPABASE_ANON_KEY = 'SUA_API_KEY_ANON_AQUI';
  
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 2. Gravar o acesso atual automaticamente
  async function registarEsteAcesso() {
    const dadosAcesso = {
      navegador: navigator.userAgent,
      idioma: navigator.language,
      plataforma: navigator.platform,
      resolucao_ecra: `${window.screen.width}x${window.screen.height}`
    };

    const { error } = await supabase
      .from('registos_acesso')
      .insert([dadosAcesso]);

    if (error) console.error('Erro ao gravar acesso:', error.message);
    
    // Depois de gravar, puxa a lista atualizada
    carregarTodosAcessos();
  }

  // 3. Procurar e listar todos os acessos guardados
  async function carregarTodosAcessos() {
    const { data: acessos, error } = await supabase
      .from('registos_acesso')
      .select('*')
      .order('data_acesso', { ascending: false });

    if (error) {
      console.error('Erro ao ir buscar acessos:', error.message);
      return;
    }

    const tbody = document.getElementById('tabela-corpo');
    
    if (!acessos || acessos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Nenhum acesso registado.</td></tr>`;
      return;
    }

    // Desenha as linhas na tabela
    tbody.innerHTML = acessos.map(item => {
      const dataFormatada = new Date(item.data_acesso).toLocaleString('pt-PT', { timeZone: 'Europe/Lisbon' });
      return `
        <tr>
          <td style="white-space: nowrap; font-weight: bold; color: #76e4ff;">${dataFormatada}</td>
          <td style="font-size: 13px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${item.navegador}">
            ${item.navegador}
          </td>
          <td><span class="status-badge">${item.idioma}</span></td>
          <td>${item.plataforma || 'Desconhecida'}</td>
          <td>${item.resolucao_ecra}</td>
        </tr>
      `;
    }).join('');
  }

  // Executa as funções ao abrir a página
  document.addEventListener('DOMContentLoaded', () => {
    registarEsteAcesso();
  });
</script>

</body>
</html>
